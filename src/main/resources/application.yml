spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: commerce
    password: commerce1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000   # 30분
  refresh-expiration: 604800000 # 7일

app:
  cookie-secure: false

---
spring:
  config:
    activate:
      on-profile: prod

app:
  cookie-secure: true

---
springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.commerce: DEBUG
    org.hibernate.SQL: DEBUG
